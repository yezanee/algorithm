name: Move LeetCode Solutions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Normalize LeetCode directories
        run: |
          shopt -s nullglob

          mkdir -p LeetCode

          echo "=== Before ==="
          ls -la

          for d in ./*; do
            if [[ -d "$d" && "$d" =~ ^\./[0-9]{4}- ]]; then
              folder=$(basename "$d")
              target="LeetCode/$folder"

              echo "Processing: $folder"

              # 이미 존재하면 merge (파일만 이동)
              if [ -d "$target" ]; then
                echo "Merging into existing: $target"
                mv "$d"/* "$target"/ 2>/dev/null || true
                rm -rf "$d"
              else
                echo "Moving to: $target"
                mv "$d" "$target"
              fi
            fi
          done

          echo "=== After ==="
          ls -la
          ls -la LeetCode

      - name: Commit & Push
        run: |
          if git status --porcelain | grep .; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            git add .
            git commit -m "chore: normalize LeetCode directory structure"
            git push
          else
            echo "No changes"
          fi
